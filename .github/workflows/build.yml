name: Build DxGT Glacier Router APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build APK with Gradle
      run: |
        cat > build.gradle << 'INNER'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        INNER
        
        cat > settings.gradle << 'INNER'
        rootProject.name = "DxGTRouter"
        include ':app'
        INNER
        
        mkdir -p app/src/main
        
        cat > app/build.gradle << 'INNER'
        apply plugin: 'com.android.application'
        
        android {
            namespace 'com.dxgt.sniper.audiorouter'
            compileSdk 34
            
            defaultConfig {
                applicationId "com.dxgt.sniper.audiorouter"
                minSdk 23
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            
            buildTypes {
                debug {
                    debuggable true
                }
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        INNER
        
        gradle wrapper
        chmod +x gradlew
        echo "✅ Gradle setup complete!"
      shell: bash
    
    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DxGT-Glacier-Router
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
