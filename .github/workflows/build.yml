name: Build DxGT Glacier Router APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y aapt2
        
    - name: Build APK
      run: |
        ANDROID_JAR=$(find $ANDROID_HOME -name "android.jar" | head -1)
        echo "Using Android JAR: $ANDROID_JAR"
        
        cd app/src/main
        
        mkdir -p build/gen build/obj build/dex build/bin
        
        echo "Compiling resources..."
        aapt2 compile -o build/gen --dir res/
        
        echo "Linking resources..."
        aapt2 link -I $ANDROID_JAR --manifest AndroidManifest.xml -o build/bin/app_unsigned.apk build/gen/*.flat
        
        echo "Compiling Java files..."
        javac -cp $ANDROID_JAR -d build/obj $(find java -name "*.java")
        
        echo "Converting to DEX..."
        d8 --lib $ANDROID_JAR --output build/dex $(find build/obj -name "*.class")
        
        echo "Packaging APK..."
        cd build/dex
        zip -u ../bin/app_unsigned.apk classes.dex
        cd ../..
        
        echo "Signing APK..."
        keytool -genkey -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US" -noprompt
        apksigner sign --ks debug.keystore --ks-pass pass:android --out DxGTRouter.apk build/bin/app_unsigned.apk
        
        mv DxGTRouter.apk ../../../
        cd ../../..
        
        echo "✅ APK built successfully!"
        ls -la DxGTRouter.apk
      shell: bash
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DxGT-Glacier-Router
        path: DxGTRouter.apk
        retention-days: 30
