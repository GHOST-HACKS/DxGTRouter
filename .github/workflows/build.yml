name: Build DxGT Glacier Router APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build APK
      run: |
        # Find android.jar
        ANDROID_JAR=$(find $ANDROID_HOME -name "android.jar" | head -1)
        echo "Using Android JAR: $ANDROID_JAR"
        
        # Go into app/src/main where files are
        cd app/src/main
        
        # Create build directories
        mkdir -p build/gen build/obj build/dex
        
        # Compile resources
        echo "📦 Compiling resources..."
        aapt2 compile -o build/gen --dir res/
        
        # Link resources
        echo "🔗 Linking resources..."
        aapt2 link -I $ANDROID_JAR --manifest AndroidManifest.xml -o build/app_unsigned.apk build/gen/*.flat
        
        # Compile Java files
        echo "☕ Compiling Java files..."
        find java -name "*.java" > sources.txt
        javac -cp $ANDROID_JAR -d build/obj @sources.txt
        
        # Convert to DEX
        echo "🔄 Converting to DEX..."
        d8 --lib $ANDROID_JAR --output build/dex $(find build/obj -name "*.class")
        
        # Package DEX into APK
        echo "📦 Packaging APK..."
        cd build/dex
        zip -u ../app_unsigned.apk classes.dex
        cd ../..
        
        # Create debug keystore
        echo "🔑 Creating keystore..."
        keytool -genkey -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US" -noprompt
        
        # Sign APK
        echo "✍️ Signing APK..."
        apksigner sign --ks debug.keystore --ks-pass pass:android --out DxGTRouter.apk build/app_unsigned.apk
        
        # Move APK to root for upload
        mv DxGTRouter.apk ../../../
        cd ../../..
        
        echo "✅ Build complete!"
        ls -la DxGTRouter.apk
      shell: bash
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DxGT-Glacier-Router
        path: DxGTRouter.apk
        retention-days: 30
